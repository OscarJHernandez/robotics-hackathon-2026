[project]
name = "robotics-hackathon-2026"
version = "0.1.0"
description = "Simulated Hiwonder JetHexa hexapod in MuJoCo"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
]

[tool.uv]
# Scripts are run from the repo; nothing is built or installed as a package.
package = false

[dependency-groups]
app = [
    "pillow>=12.3.0",
]
# Walking from a to b with TabPFN (nav/): `uv run --group ml ...`, used by the just recipes that need it.
ml = [
    "duckdb>=1.5.6",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.4",
    "tabpfn>=10.2.0",
    "tabpfn-client>=0.10.1",
]
vision = [
    "pillow>=12.3.0",
    "torch>=2.14.1",
]
