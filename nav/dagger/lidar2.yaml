# DAgger settings, lidar + DINOv2 strip + edge recovery: just dagger-worker ... --config nav/dagger/lidar2.yaml
# `just dagger --config nav/dagger/dagger.yaml`; `--smoke` shrinks everything for a quick check.

seed: 0

# Rounds: beta = chance per step that the expert's command is executed instead of the student's.
# The label is always the expert's command. Round 0 has no student yet (beta 1).
rounds:
  - {episodes: 1000, beta: 1.0}
  - {episodes: 300, beta: 0.5}   # round 1: the student drives half the steps, so it gets near edges
  - {episodes: 100, beta: 0.25}
  - {episodes: 100, beta: 0.0}
  - {episodes: 100, beta: 0.0}

scenes:
  train: 1000      # scene ids 0..999: one random obstacle layout each
  heldout: 200     # scene ids 100000..100199, never used for fitting
  heldout_episodes: 200

env:
  n_envs: 16           # robots stepped in lock-step per process
  max_steps: 300       # gait cycles (1 s each) before a timeout
  goal_radius: 0.25    # metres from the target pillar
  min_start_dist: 1.0  # metres between start and target
  simple: null         # null: mesh model when sim/meshes exists, else simple shapes

expert:
  cell: 0.05           # metres per planning grid cell
  inflate: 0.32        # metres kept between the robot's centre and any wall or obstacle
  lookahead: 0.40      # metres along the path to the pure-pursuit point
  gain: 0.6            # turn = gain * heading error, clipped to the turn range
  stop_turning: 0.8    # radians: above this heading error the robot turns on the spot
  recover:             # closer than this to furniture or a wall: back up while turning away, then go on
    clearance: 0.30    # metres from the body centre (the legs reach 0.26-0.29 m) ...
    cone: 45           # ... with the obstacle within 45 degrees of straight ahead: about to walk into it
    back_stride: -0.12 # about 5 cm back per cycle
    side_clearance: 0.31     # obstacle beside (45-135 degrees) closer than this ...
    converge: 0.02           # ... and a 10 cm step forward would bring it this much closer (heading into it):
    side_back_stride: -0.06  # step back slightly (about 2 cm) while turning away from that side
                             # (the plain expert passes edges alongside them: 40/40 goals, rule fired 6 times)
    turn: 0.20

features:
  perception: strip    # strip: DINOv2 on the horizon band only, 3 PCA values per cell (vision/strip_pca.py)
  strip_pca: full60/pca3-strip.npz   # under data/vision/
  probe: full60/probe-mlp256.pt   # under data/vision/
  patch_pool: 2        # 2 = 13 x 23 blocks of 2 x 2 patches (majority class, mean depth): 299 + 299 + 8 = 606 columns;
                       # 1 = all 26 x 46 patches (2,400 columns). Re-pool old runs: python -m nav.dagger.repool
  depth_cap: 10.0      # metres
  use_prev_command: false
  patch_depths: false  # no depth-camera columns: the depth camera only feeds the safety stop
  depth_summary: false
  depth_scan: 0
  lidar_beams: 36      # lr_0..lr_35 (one per 10 degrees) + lc_ahead, lc_left, lc_right, lc_rear, lc_near
  history: 2           # h1_lc_*, h2_lc_*: the lidar summary of the 2 previous steps
                       # 3 goal + 36 + 5 + 69 strip (dp_<cell>_<k>: 23 cells x 3) + 10 = 123 columns

safety:                # applied only when the student's command is executed (rollout.lidar_safety)
  enabled: true
  source: lidar        # lidar: leg-aware rules below, 360 degrees; depth: the depth camera's stop ahead only
  # the legs reach 0.27 m ahead/behind, 0.26 m sideways, 0.29 m at the corners (measured while walking)
  stop_distance: 0.48  # metres from the body centre: no stride when an obstacle in the corridor is closer
  corridor: 0.32       # half width of the corridor ahead: legs 0.26 + 0.06
  side_clearance: 0.32 # walking past something this close beside the legs: turn away at least `nudge`
  nudge: 0.10
  sweep_radius: 0.35   # turning on the spot sweeps the legs to 0.29 m: no turn into an obstacle within this
  turn: 0.25           # after a stop: turn on the spot toward the safe / freer side
  rear_distance: 0.40  # no backing up into something closer than this behind (legs 0.27 + margin)

student:
  model_version: v3.5
  backend: api         # local: TabPFN on this machine; api: Prior Labs' hosted TabPFN (tabpfn-client), which
                       # uploads the rows and uses the account's monthly quota on every predict()
  device: auto         # cuda, then mps, then cpu (local backend only)
  n_estimators: 4
  column_groups: [goal, lidar, lidar_summary, history, dino_strip]   # all 123 recorded columns
  max_context_rows: 8000   # rows spread evenly over the expert's stride and turn bins; null = every aggregated row
