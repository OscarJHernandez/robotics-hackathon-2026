# DAgger settings, depth only (no DINOv2): just dagger-worker ... --config nav/dagger/depth.yaml
# `just dagger --config nav/dagger/dagger.yaml`; `--smoke` shrinks everything for a quick check.

seed: 0

# Rounds: beta = chance per step that the expert's command is executed instead of the student's.
# The label is always the expert's command. Round 0 has no student yet (beta 1).
rounds:
  - {episodes: 1000, beta: 1.0}
  - {episodes: 100, beta: 0.5}
  - {episodes: 100, beta: 0.25}
  - {episodes: 100, beta: 0.0}
  - {episodes: 100, beta: 0.0}

scenes:
  train: 1000      # scene ids 0..999: one random obstacle layout each
  heldout: 200     # scene ids 100000..100199, never used for fitting
  heldout_episodes: 200

env:
  n_envs: 16           # robots stepped in lock-step per process
  max_steps: 300       # gait cycles (1 s each) before a timeout
  goal_radius: 0.25    # metres from the target pillar
  min_start_dist: 1.0  # metres between start and target
  simple: null         # null: mesh model when sim/meshes exists, else simple shapes

expert:
  cell: 0.05           # metres per planning grid cell
  inflate: 0.32        # metres kept between the robot's centre and any wall or obstacle
  lookahead: 0.40      # metres along the path to the pure-pursuit point
  gain: 0.6            # turn = gain * heading error, clipped to the turn range
  stop_turning: 0.8    # radians: above this heading error the robot turns on the spot

features:
  perception: none     # none: depth camera only, no patch classes and no DINOv2 (about 12x faster per step)
  probe: full60/probe-mlp256.pt   # under data/vision/
  patch_pool: 2        # 2 = 13 x 23 blocks of 2 x 2 patches (majority class, mean depth): 299 + 299 + 8 = 606 columns;
                       # 1 = all 26 x 46 patches (2,400 columns). Re-pool old runs: python -m nav.dagger.repool
  depth_cap: 10.0      # metres
  use_prev_command: false
  patch_depths: true   # pd_*: 299 mean depths of the 13 x 23 grid
  depth_summary: true  # dc_ahead, dc_left, dc_right, dc_near
  depth_scan: 15       # ds_0..ds_14: nearest obstacle in 15 directions across the 62 degree view (about 4 each)
  history: 2           # h1_dc_*, h2_dc_*: the depth distances of the 2 previous steps
                       # recorded: 299 + 3 goal + 4 + 15 + 8 = 329 columns; the student uses column_groups

safety:                # depth-camera stop, applied only when the student's command is executed
  enabled: true
  stop_distance: 0.45  # metres from the body centre to the nearest obstacle in the robot-wide corridor ahead
  turn: 0.25           # then: no stride, turn on the spot toward the freer side (dc_left vs dc_right)

student:
  model_version: v3.5
  backend: api         # local: TabPFN on this machine; api: Prior Labs' hosted TabPFN (tabpfn-client), which
                       # uploads the rows and uses the account's monthly quota on every predict()
  device: auto         # cuda, then mps, then cpu (local backend only)
  n_estimators: 4
  column_groups: [goal, depth, history, scan]   # 30 columns. [goal, depth, history] = 15;
                                                # [goal, depth, history, patch_depth] = 314; null = all recorded
  max_context_rows: 8000   # rows spread evenly over the expert's stride and turn bins; null = every aggregated row
